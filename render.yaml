# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the API, the web app and Postgres. The WORKFLOW service is created separately (see README),
# because Workflows is in beta — check whether Blueprints support it yet before relying on that.
services:
  - type: web
    name: kabaad-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: kabaad-db
          property: connectionString
      - key: TOOL_SHARED_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SLUG
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false   # https://kabaad-api.onrender.com (used for audio links)
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: kabaad-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # https://kabaad-api.onrender.com
      - key: VITE_ELEVENLABS_AGENT_ID
        sync: false

databases:
  - name: kabaad-db
    plan: free
